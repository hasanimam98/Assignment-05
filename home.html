<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Issue Tracker</title>
    <!-- tailwindcss+Daisy -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- G.Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- F.Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-gray-200">
    <!-- Navbar -->

    <nav>
      <div class="navbar bg-base-100 shadow-sm">
        <div class="flex-1">
          <div class="flex">
            <div class="w-12 rounded-full">
              <img
                alt="Tailwind CSS Navbar component"
                src="./B13-A5-Github-Issue-Tracker/assets/github-logo.png"
              />
            </div>
            <a class="btn btn-ghost text-lg md:text-xl">Issue Tracker</a>
          </div>
        </div>
        <div class="flex gap-2">
          <!-- Input -->
          <label class="input w-[100px] md:w-full max-w-md">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              id="searchInput"
              type="search"
              required
              placeholder="Search  Issues"
            />
          </label>
          <button id="search-btn" class="btn btn-primary">Search</button>
        </div>
      </div>
    </nav>
    <!-- tab -->
    <main class="w-10/12 mx-auto">
      <div class="flex gap-2 mt-20 bg-white p-5 rounded shadow-xs">
        <button
          id="all-btn"
          onclick="togglebtn('all-btn')"
          class="btn btn-primary min-w-[100px]"
        >
          All
        </button>
        <button
          id="open-btn"
          onclick="togglebtn('open-btn')"
          class="btn min-w-[100px]"
        >
          Open
        </button>
        <button
          id="close-btn"
          onclick="togglebtn('close-btn')"
          class="btn min-w-[100px]"
        >
          Closed
        </button>
      </div>
      <!-- section -->
      <section class="bg-white my-5 rounded">
        <div id="loading-spinner" class="flex justify-center">
          <span class="loading loading-dots loading-xl"></span>
        </div>

        <!-- counting -->
        <div
          class="flex justify-between items-center p-3 mt-4 border-b border-gray-400"
        >
          <!-- card count -->
          <div class="flex gap-2 items-center">
            <div
              class="border border-[#570DF9] w-11 h-11 rounded-full bg-purple-200 p-1 flex"
            >
              <img
                src="./B13-A5-Github-Issue-Tracker/assets/Aperture.png"
                alt=""
              />
            </div>
            <div class=" ">
              <h3 class="text-xl font-semibold md:text-2xl">
                <span id="card-count">50</span> Issues
              </h3>
              <p class="text-xs font-semibold md:text-sm">
                Track & manage your project issues
              </p>
            </div>
          </div>
          <!-- Open & Close Shut -->
          <div
            class="flex gap-3 font-semibold text-sm md:text-sm md:mx-8 md:gap-6"
          >
            <p><i class="fa-solid fa-circle text-green-700"></i> Open</p>
            <p><i class="fa-solid fa-circle text-purple-400"></i> Closed</p>
          </div>
        </div>

        <div
          id="card-container"
          class="my-4 grid gap-4 justify-center lg:grid-cols-4 sm:grid-cols-2 md:p-3"
        ></div>
      </section>

      <dialog id="card-detail-modal" class="modal"></dialog>
    </main>

    <script src=".//JS/main-page.js"></script>
  </body>
</html>
